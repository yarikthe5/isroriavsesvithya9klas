<style>
:root{--bg:#f6f4ef;--c:#fff;--t:#1d1d22;--m:#6b6b76;--a:#3b5bdb;--ok:#2f9e44;--no:#e03131;--bd:#e3e0d8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15161a;--c:#1f2127;--t:#ececf1;--m:#9a9aa6;--a:#7c93ff;--ok:#51cf66;--no:#ff6b6b;--bd:#31343d}}
:root[data-theme="dark"]{--bg:#15161a;--c:#1f2127;--t:#ececf1;--m:#9a9aa6;--a:#7c93ff;--ok:#51cf66;--no:#ff6b6b;--bd:#31343d}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--t);font:17px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}

.top{position:sticky;top:0;background:var(--bg);padding:6px 0 10px;z-index:2}
.bar{height:8px;background:var(--bd);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--a);transition:width .3s}
.meta{display:flex;justify-content:space-between;font-size:13px;color:var(--m);margin-top:6px}
.dots{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap}.dots b{width:20px;height:8px;border-radius:4px;background:var(--bd)}
.dots .r{background:var(--a)}.dots .g{background:var(--ok)}.dots .w{background:var(--no)}
.card{background:var(--c);border:1px solid var(--bd);border-radius:18px;padding:22px;margin:10px 0;flex:1;animation:in .25s}
@keyframes in{from{opacity:0;transform:translateY(8px)}}

ul{padding-left:20px;margin:0}li{margin:0 0 11px}b{color:var(--a)}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:15px;font:inherit;font-weight:700;background:var(--a);color:#fff;cursor:pointer;margin-top:10px}
.btn.s{background:var(--bd);color:var(--t)}
.opt{display:block;width:100%;text-align:left;background:var(--bg);color:var(--t);border:2px solid var(--bd);border-radius:12px;padding:13px 15px;margin:9px 0;font:inherit;cursor:pointer}

.fb{padding:12px;border-radius:12px;margin-top:10px;background:var(--bg);border:1px solid var(--bd)}
.big{font-size:54px;text-align:center}.c{text-align:center}.sm{color:var(--m);font-size:15px}
.pop{position:fixed;top:38%;z-index:9;font-weight:800;font-size:28px;color:var(--ok);pointer-events:none;animation:up .9s forwards;text-shadow:0 2px 8px #0003;white-space:nowrap}

.cf{position:fixed;top:-30px;z-index:9;pointer-events:none;animation:fall 2s linear forwards}

.shake{animation:sk .35s}@keyframes sk{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.boss{margin:6px 0 2px}.boss i{background:var(--no)}
.rank{display:inline-block;background:var(--bg);border:1px solid var(--bd);border-radius:20px;padding:4px 12px;font-weight:700;margin:2px}

["§1.1","Причини Французької революції",["Франція — <b>абсолютна монархія</b>; ідеї Просвітництва (Вольтер, Монтеск’є)","<b>Луї XV</b> (1715–1774): розпустив «парламенти», змусив аристократів частково платити податки, вигнав єзуїтів","Увесь тягар податків ніс <b>третій стан</b>; двір марнотратив; «старий порядок» = привілеї дворян і духівництва","<b>Луї XVI</b> (1774–1793): міністри фінансів <b>Тюрго, Неккер</b>; «хлібні» війни; королева <b>Марія-Антуанетта</b>","1783 — повернулись учасники <b>війни за незалежність США</b>","<b>Конституційна монархія</b> — влада монарха обмежена конституцією"]],
["§1.2","Початок революції",["Король скликав <b>Генеральні штати</b> (вперше за 170+ років); третій стан → Національні, 9 липня 1789 — <b>Установчі збори</b>","<b>14 липня 1789</b> — штурм <b>Бастилії</b> (символ «старого порядку», було лише 7 в’язнів) = початок революції","<b>26 серпня 1789</b> — <b>Декларація прав людини і громадянина</b>: влада народу, природні права (безпека, свобода, власність), свобода слова й віри","Короля з Версаля силоміць перевезли до Парижа","1789–91: скасовано цехи, стани, титули; відібрано церковні землі","<b>3 вересня 1791</b> — Конституція: <b>конституційна монархія</b>; закони видають Законодавчі збори; гасло <b>«Нація. Закон. Король»</b>"]],
["§1.3","Законодавчі збори. Жирондисти та якобінці",["Засідали з <b>жовтня 1791</b>. <b>Фельяни</b> — за примирення з Бурбонами; <b>«болото»</b> — більшість без чіткої позиції","<b>Жирондисти</b> (деп. Жиронда): недоторканність власності, поступове скасування влади короля","<b>Якобінці</b> (клуб у монастирі Св. Якоба): <b>Марат</b> (газета «Друг народу»), <b>Дантон</b> (міністр юстиції), <b>Робесп’єр</b>","<b>1792</b> — Австрія й Пруссія створили <b>першу антифранцузьку коаліцію</b>","«<b>Марсельєза</b>» (Руже де Ліль) — нині гімн Франції"]],
["§2.1","Республіка. Страта короля",["Невдала втеча Луї XVI → <b>серпневе повстання 1792</b>; короля ув’язнили; санкюлоти вбили ~5 тис. людей","Вересень 1792 — <b>Національний конвент</b>; <b>22 вересня 1792</b> — Франція <b>республіка</b>, гасло <b>«Свобода. Рівність. Братерство»</b>","Жирондисти — проти страти, якобінці — за. <b>21 січня 1793</b> — страта Луї XVI","Наслідки: нові держави в коаліції, <b>Вандейське повстання</b> (роялісти), Комітет громадського порятунку, Революційний трибунал","<b>2 червня 1793</b> — переворот, до влади прийшли якобінці"]],
["§2.2","Якобінський терор",["<b>24 червня 1793</b> — демократична Конституція (загальне виборче право), але дію призупинили через війну","Другий Комітет громадського порятунку очолив <b>Робесп’єр</b>","Липень 1793: <b>Шарлотта Корде</b> вбила Марата → почався <b>терор</b>","Вересень 1793 — <b>«Декрет про підозрілих»</b>; страчено десятки тисяч, серед них Дантона","Новації: <b>революційний календар</b>, <b>«Декрет про загальний максимум»</b> (сталі ціни), <b>«Декрет про всенародне ополчення»</b> (чоловіки 18–25, армія до 1 млн)","<b>27 липня 1794</b> (9 термідора) — Робесп’єра арештовано й страчено"]],

["§3.1","Імперія Наполеона. Кодекси",["Наполеон: перший консул → <b>1802 довічний консул</b> → <b>1804 імператор</b> Наполеон I (сам вдягнув корону)","Конституція 1799: Декларації прав більше нема, вся влада в Наполеона; цензура, поліція, призначення префектів","<b>Французький банк</b> (1800)","<b>Цивільний кодекс 1804</b> («Кодекс Наполеона») — рівність громадян, власність","<b>Комерційний 1807</b> — поняття «анонімного» (акціонерного) товариства; <b>Кримінальний</b> — вина лише за рішенням суду, «неосудність»"]],
["§3.2","Наполеонівські війни",["Сильна армія: призови, технічні новинки (повітряні кулі, консервований горох)","<b>Гогенлінден</b> (грудень 1800) — перемога над Австрією, кінець 2-ї коаліції","<b>Аустерліц, 2 грудня 1805</b> — розгром 3-ї коаліції (Австрія + Росія); 1806 — кінець Священної Римської імперії → <b>Рейнський союз</b>","1806 — Єна й Ауерштадт (Пруссія); <b>континентальна блокада</b> Великої Британії","<b>1807 Тільзитський мир</b> з Росією; 1808 — Іспанія, Португалія; <b>Ваграм, 5–6 липня 1809</b> — кінець 5-ї коаліції","Наслідок: виснаження, національні рухи, патріотизм французів згасає"]],
["§3.3","Падіння Наполеона. Віденський конгрес",["<b>1812</b> — похід у Росію (600 тис.); <b>Бородіно 7 вересня 1812</b>; Москва; відступ — «велика армія» зникла","6-та коаліція; <b>Лейпциг, 16–19 жовтня 1813</b> — «<b>битва народів</b>», поразка","<b>1814</b> — зречення, острів <b>Ельба</b>; королем Луї XVIII (Бурбони)","<b>Віденський конгрес</b> (18.09.1814–9.06.1815): Франція — кордони 1792; Британія — Цейлон; Австрія — Венеція, Ломбардія; Пруссія — пів Саксонії; Росія — більшість Варшавського князівства + Фінляндія; Нідерланди об’єднано; <b>Швейцарія — вічний нейтралітет</b>","«<b>Сто днів</b>» (бер.–черв. 1815); <b>Ватерлоо, 18 червня 1815</b>; заслання на о. <b>Святої Гелени</b>","Вересень 1815 — <b>Священний союз</b> (допомагати придушувати революції)"]],
["§4.1","Зародження індустріального суспільства",["Почалося в <b>Англії</b>; термін «індустріальна революція» — <b>Арнольд Тойнбі</b>","<b>1784 Джеймс Ватт</b> — парова машина → текстиль, металургія, вугілля, хімія","<b>1807 Роберт Фултон</b> — перший пароплав; паровози (спершу ~10 км/год); наприкінці ХІХ ст. пару змінила <b>електрика</b>, почався видобуток нафти","<b>США</b>: індустріальна Північ — аграрний Південь (плантації, раби); спиралися на європейські капітали; експансія до Тихого океану"]],
["§4.2","Індустріалізація і повсякдення",["<b>Урбанізація</b> — ріст міст; дешева масова продукція витісняла ремісників","Робітники безправні, <b>дитяча праця</b> → рух за права робітників","Трамваї, телеграф, телефон, метро; швейна машинка Зінгер, дизель, ручка Паркер, морзянка, <b>кінематограф</b>","<b>1879 Карл Бенц</b> — бензиновий двигун і автомобіль (Берта Бенц — перша за кермом)","З колоній везли чай, каву, цукор, бавовну; політичні права — привілей європейців"]],
["§4.3","Парламентаризм та ідеології",["Після революції: відхід від «старого порядку», рівність перед законом, <b>парламентаризм</b> (основа — англійський парламент), політичні <b>партії</b>","<b>Монтеск’є</b> — розподіл влади: законодавча, виконавча, судова","<b>Консерватизм</b> — збереження традицій, обережні зміни","<b>Лібералізм</b> — свобода особи, парламентаризм, реформи","<b>Соціалізм</b> — економічна справедливість, рівні можливості","<b>Націоналізм</b> — нація як найвища цінність"]],

 return `<div class="top"><div class="bar"><i style="width:${Math.max(0,Math.min(100,p))}%"></i></div><div class="meta"><span>${label}</span><a onclick="menu()" style="color:var(--a);cursor:pointer">☰ меню</a></div><div class="meta"><span>⭐ ${st.xp||0} · ${LV[lvl()][1]}</span><span>${st.cb>1?"🔥 x"+st.cb+" · ":""}📅 ${st.days||0} дн.</span></div><div class="dots">${dots}</div></div>`}
const LB={sec:"Згадай",mix:"Мікс-повторення",final:"Слабкі картки",daily:"Повторення на сьогодні",only:"Усі картки"};
function draw(){
 if(!st||st.ph=="start"){const d=due().length,p=st&&st.prev;
  $.innerHTML=`<div class="card c"><div class="big">🧠</div><h1>Історія 9 кл. · §1–5</h1><p><span class="rank">${LV[lvl()][1]}</span><span class="rank">⭐ ${(st&&st.xp)||0} XP</span><span class="rank">🔥 ${(st&&st.days)||0} дн. підряд</span></p><p class="sm">Збирай XP, тримай серію 🔥, перемагай боса в тесті й дорости до <b>Наполеона 👑</b></p><p style="text-align:left">1) Читаєш ОДНУ тему (💡 + факти)<br>2) Одразу <b>згадуєш</b> її на картках: не знаєш — картка повертається<br>3) Після кожних 3 тем — мікс-повторення<br>4) Слабкі картки → тест → помилки по колу<br>5) Завтра й далі: «Повторення на сьогодні» — картки приходять самі, коли їх час</p>
  ${p?`<button class="btn" onclick="st.ph=st.prev;draw()">Продовжити</button>`:""}<button class="btn ${p?"s":""}" onclick="fresh()">${p?"Почати спочатку":"Почати"}</button>${d?`<button class="btn">Повторення на сьогодні (${d})</button>`.replace('class="btn"','class="btn" onclick="daily()"'):""}<button class="btn s" onclick="cardsOnly()">Усі картки підряд</button><button class="btn s" onclick="mute()">${st&&st.mute?"🔇 Звук вимкнено":"🔊 Звук увімкнено"}</button></div>`;if(!st)st={ph:"start",read:[],rv:{}};return}
 if(st.ph=="learn"){const i=st.sq[st.si],s=S[i];
  $.innerHTML=hdr(`${st.round?"Перечитування":"Читаємо"} · тема ${st.si+1} з ${st.sq.length}`,st.si/st.sq.length*100)+`<div class="card"><div class="tag">${E[i]} ${s[0]}</div><h2>${s[1]}</h2><div class="fb">💡 <b>Головне:</b> ${M[i]}</div><br><ul>${s[2].map(x=>`<li>${x}</li>`).join("")}</ul></div><p class="sm c">Прочитай один раз уважно. Далі — картки: ти згадуватимеш сам.</p><button class="btn" onclick="readDone()">Прочитав → перевіряю себе</button>`;scrollTo(0,0);return}
 if(st.ph=="recall"){if(!st.cq.length){recallEnd();return}const c=C[st.cq[0]];
  $.innerHTML=hdr(`${LB[st.rm]}: лишилось ${st.cq.length}`,(1-st.cq.length/st.n)*100)+`<div class="card c"><div class="tag">${E[c[0]]} ${S[c[0]][0]}</div><p class="sm">Скажи відповідь вголос чи подумки — і тоді відкривай</p><h2>${c[1]}</h2><div id="bk" class="fb" style="display:none"><b>${c[2]}</b></div></div><div id="bt"><button class="btn" onclick="flip()">Показати відповідь</button></div>`;scrollTo(0,0);return}
 if(st.ph=="quiz"){const n=st.pend[st.qi],q=Q[n];cur={n,o:sh(q.slice(2)),done:false};
  $.innerHTML=hdr(`Тест: ${st.qi+1} з ${st.pend.length}${st.round?" (повтор помилок)":""}`,st.qi/st.pend.length*100)+`<div class="sm">👑 Бос-файт: Наполеон — ${Math.round((1-(st.hit||0)/st.pend.length)*100)}% здоров’я</div><div class="bar boss"><i style="width:${Math.round((1-(st.hit||0)/st.pend.length)*100)}%"></i></div><div class="card"><div class="tag">${E[q[0]]} ${S[q[0]][0]}</div><h2>${q[1]}</h2><div id="o">${cur.o.map((t,k)=>`<button class="opt" onclick="ans(${k})">${t}</button>`).join("")}</div><div id="fb"></div></div>`;scrollTo(0,0);return}
 if(st.ph=="res"){const w=[...new Set(st.wrong.map(n=>Q[n][0]))];
  $.innerHTML=hdr("Результат раунду",100)+`<div class="card c"><div class="big">🔁</div><h2>Помилок: ${st.wrong.length} з ${st.pend.length}</h2><p>Треба довчити:</p><p>${w.map(i=>`<b>${S[i][0]}</b> ${S[i][1]}`).join("<br>")}</p></div><button class="btn" onclick="relearn()">Перечитати й згадати ці теми</button>`;return}
 if(st.ph=="done"){$.innerHTML=hdr("Готово!",100)+`<div class="card c"><div class="big">🏆</div><h1>Усе засвоєно!</h1><p>Усі ${Q.length} питань правильно. Раундів повторення: ${st.round}.</p><p class="sm">Щоб воно не вивітрилось — завтра і післязавтра відкрий «Повторення на сьогодні» (5 хвилин).</p></div><button class="btn" onclick="menu()">☰ До меню</button><button class="btn s" onclick="fresh()">Пройти все з нуля</button>`}}
function flip(){document.getElementById("bk").style.display="block";document.getElementById("bt").innerHTML='<button class="btn" onclick="kn(1)">Знав ✓</button><button class="btn s" onclick="kn(0)">Не знав — ще раз ↻</button>'}
function kn(y){const i=st.cq.shift();
 if(y){st.cb=(st.cb||0)+1;gain(8+Math.min(st.cb,5)*2);sndOk();if(!st.sm.includes(i))grade(i,true);st.miss=st.miss.filter(x=>x!=i)}
 else{st.cb=0;sndNo();if(!st.sm.includes(i)){st.sm.push(i);grade(i,false)}if(!st.miss.includes(i))st.miss.push(i);st.cq.splice(Math.min(3,st.cq.length),0,i)}
 save();draw()}
function rc(l,m){st.cq=sh(l);st.n=l.length||1;st.rm=m;st.sm=[];st.ph="recall";save();draw()}
function recallEnd(){const m=st.rm;
 if(m=="sec"){gain(30);confetti(18);setTimeout(()=>pop("Тема засвоєна 🎉"),500);const k=st.si+1;if(!st.round&&k%3==0)return rc(st.sq.slice(k-3,k).flatMap(cc),"mix");return adv()}
 if(m=="mix"){gain(40);return adv()}
 if(m=="final"){gain(60);return toQuiz()}
 st.ph="start";save();draw()}
function adv(){st.si++;if(st.si>=st.sq.length){if(!st.round&&st.miss.length)return rc(st.miss.slice(),"final");return toQuiz()}st.ph="learn";save();draw()}
function toQuiz(){st.hit=0;st.ph="quiz";st.qi=0;st.wrong=[];st.pend=sh(st.pend);save();draw()}
function readDone(){const i=st.sq[st.si];if(!st.read.includes(i))st.read.push(i);rc(cc(i),"sec")}
function daily(){const l=due();if(!l.length)return;if(st.prev=="recall")st.prev="learn";rc(l,"daily")}
function cardsOnly(){if(!st||!st.pend){fresh();st.prev="learn"}if(st.prev=="recall")st.prev="learn";rc(ALLC(),"only")}
function menu(){st.prev=st.ph;st.ph="start";save();draw()}
function ans(k){if(cur.done)return;cur.done=true;const q=Q[cur.n],ok=cur.o[k]==q[2];
 [...document.querySelectorAll(".opt")].forEach((b,j)=>{if(cur.o[j]==q[2])b.classList.add("ok");else if(j==k)b.classList.add("no");b.style.pointerEvents="none"});
 if(!st.seen.includes(cur.n))st.seen.push(cur.n);
 if(ok){st.unk=st.unk.filter(x=>x!=cur.n);st.hit=(st.hit||0)+1;st.cb=(st.cb||0)+1;gain(10+Math.min(st.cb,5)*3);sndOk()}else{st.wrong.push(cur.n);st.cb=0;sndNo();const cd=document.querySelector(".card");if(cd)cd.classList.add("shake")}
 document.getElementById("fb").innerHTML=`<div class="fb">${ok?"✅ "+rnd(CH)+(st.cb>2?" Серія x"+st.cb+"!":""):`❌ ${rnd(OOPS)}<br>Правильна відповідь: <b>${q[2]}</b><br><span class="sm">Повтори: ${S[q[0]][0]} ${S[q[0]][1]}</span>`}</div><button class="btn" onclick="next()">Далі →</button>`;save()}
function next(){st.qi++;if(st.qi>=st.pend.length){st.ph=st.wrong.length?"res":"done";if(!st.wrong.length){gain(100);confetti(80)}}save();draw()}
function relearn(){st.sq=[...new Set(st.wrong.map(n=>Q[n][0]))].sort((a,b)=>a-b);st.si=0;st.pend=st.wrong.slice();st.wrong=[];st.round++;st.hit=0;st.ph="learn";save();draw()}
if(st&&!st.ph)st=null;draw();
</script></body></html>
